{% extends 'layouts/auth_layout.html' %}

{% block title %} Registro {% endblock title %} 

{% block content %}
<section class="flex items-center justify-center min-h-screen bg-yellow-50 px-4">
    <a href="{% url 'user:auth_login' %}" class="absolute top-4 left-4 bg-blue-900 text-white px-4 py-2 rounded hover:bg-yellow-950">
    Volver
  </a>
    <div class="w-full max-w-md bg-white shadow-md rounded-lg p-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Registrarse</h1>

    <form method="POST" enctype="multipart/form-data" class="space-y-4">
    {% csrf_token %}
    
    <div class="space-y-3">
    {{ form.as_p }}
    </div>  

        <button type="submit" class="w-full bg-blue-900 text-white py-2 rounded hover:bg-yellow-950 transition">
            Registrarme
        </button>
    </form>
    <p class="text-center text-sm text-gray-600 mt-4">
  ¿No tenés una cuenta?
  <a href="{% url 'user:auth_login' %}" class="text-blue-600 hover:underline">Iniciar sesión</a>
</p>
    </div>
</section>
{% endblock content %}
